<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Project Workflow Flowchart</title>
<style>
  body{margin:0;padding:28px 16px 48px;background:#fff;
       font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;}
  .wrap{max-width:1020px;margin:0 auto;}
  h1{font-size:19px;font-weight:700;text-align:center;color:#12151c;margin:0 0 26px;letter-spacing:-.01em;}
  svg{display:block;width:100%;height:auto;}
  @media print{ body{padding:0;} h1{font-size:16px;} }
</style>
</head>
<body>
<div class="wrap">
<h1>Personalized AI-Based Narrative Content Creation and Voice Generation — System Workflow</h1>

<svg viewBox="0 0 1000 1330" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5a6472"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b3382f"/>
    </marker>
  </defs>

  <g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif"
     font-size="14.5" font-weight="600" fill="#12151c"
     text-anchor="middle" dominant-baseline="middle">

  <!-- ============ START ============ -->
  <rect x="320" y="20" width="240" height="48" rx="24" fill="#eef0f3" stroke="#5a6472" stroke-width="1.8"/>
  <text x="440" y="45">User Opens Application</text>

  <line x1="440" y1="68" x2="440" y2="98" stroke="#5a6472" stroke-width="1.8" marker-end="url(#a)"/>

  <!-- ============ DECISION: input type ============ -->
  <path d="M 440 102 L 525 146 L 440 190 L 355 146 Z" fill="#fbf2e0" stroke="#a86d1f" stroke-width="1.8"/>
  <text x="440" y="146" font-size="13.5">Input Type?</text>

  <!-- left: voice -->
  <path d="M 355 146 L 240 146 L 240 210" fill="none" stroke="#5a6472" stroke-width="1.8" marker-end="url(#a)"/>
  <text x="288" y="134" font-size="12.5" font-weight="700" fill="#5a6472">Voice</text>
  <rect x="150" y="214" width="180" height="48" rx="6" fill="#eaf1f9" stroke="#2563a8" stroke-width="1.8"/>
  <text x="240" y="239">Speech to Text</text>

  <!-- right: text -->
  <path d="M 525 146 L 640 146 L 640 210" fill="none" stroke="#5a6472" stroke-width="1.8" marker-end="url(#a)"/>
  <text x="594" y="134" font-size="12.5" font-weight="700" fill="#5a6472">Text</text>
  <rect x="550" y="214" width="180" height="48" rx="6" fill="#eaf1f9" stroke="#2563a8" stroke-width="1.8"/>
  <text x="640" y="239">Text Entry</text>

  <!-- merge -->
  <path d="M 240 262 L 240 300 L 640 300 L 640 262" fill="none" stroke="#5a6472" stroke-width="1.8"/>
  <line x1="440" y1="300" x2="440" y2="326" stroke="#5a6472" stroke-width="1.8" marker-end="url(#a)"/>

  <!-- ============ DECISION: safety ============ -->
  <path d="M 440 330 L 555 378 L 440 426 L 325 378 Z" fill="#fbf2e0" stroke="#a86d1f" stroke-width="1.8"/>
  <text x="440" y="371" font-size="13">Crisis Content</text>
  <text x="440" y="387" font-size="13">Detected?</text>

  <!-- yes branch -->
  <path d="M 555 378 L 730 378" fill="none" stroke="#b3382f" stroke-width="1.8" marker-end="url(#ar)"/>
  <text x="640" y="366" font-size="12.5" font-weight="700" fill="#b3382f">Yes</text>
  <rect x="735" y="354" width="190" height="48" rx="6" fill="#fbeceb" stroke="#b3382f" stroke-width="1.8"/>
  <text x="830" y="371" font-size="13.5">Show Support</text>
  <text x="830" y="387" font-size="13.5">Resources</text>

  <line x1="830" y1="402" x2="830" y2="438" stroke="#b3382f" stroke-width="1.8" marker-end="url(#ar)"/>
  <rect x="735" y="442" width="190" height="44" rx="22" fill="#eef0f3" stroke="#5a6472" stroke-width="1.8"/>
  <text x="830" y="464">End Session</text>

  <!-- no branch -->
  <text x="462" y="444" font-size="12.5" font-weight="700" fill="#5a6472">No</text>
  <line x1="440" y1="426" x2="440" y2="456" stroke="#5a6472" stroke-width="1.8" marker-end="url(#a)"/>

  <!-- ============ MAIN PIPELINE ============ -->
  <rect x="320" y="460" width="240" height="48" rx="6" fill="#eaf1f9" stroke="#2563a8" stroke-width="1.8"/>
  <text x="440" y="485">Language Analysis</text>
  <line x1="440" y1="508" x2="440" y2="536" stroke="#5a6472" stroke-width="1.8" marker-end="url(#a)"/>

  <rect x="320" y="540" width="240" height="48" rx="6" fill="#eaf1f9" stroke="#2563a8" stroke-width="1.8"/>
  <text x="440" y="565">Emotion Detection</text>
  <line x1="440" y1="588" x2="440" y2="616" stroke="#5a6472" stroke-width="1.8" marker-end="url(#a)"/>

  <rect x="290" y="620" width="300" height="48" rx="6" fill="#eaf1f9" stroke="#2563a8" stroke-width="1.8"/>
  <text x="440" y="637" font-size="13.5">Thought Pattern &amp; Limiting</text>
  <text x="440" y="653" font-size="13.5">Belief Identification</text>
  <line x1="440" y1="668" x2="440" y2="696" stroke="#5a6472" stroke-width="1.8" marker-end="url(#a)"/>

  <rect x="320" y="700" width="240" height="48" rx="6" fill="#eaf1f9" stroke="#2563a8" stroke-width="1.8"/>
  <text x="440" y="725">Goal Identification</text>
  <line x1="440" y1="748" x2="440" y2="776" stroke="#5a6472" stroke-width="1.8" marker-end="url(#a)"/>

  <rect x="320" y="780" width="240" height="48" rx="6" fill="#eaf1f9" stroke="#2563a8" stroke-width="1.8"/>
  <text x="440" y="805">Context Understanding</text>
  <line x1="440" y1="828" x2="440" y2="856" stroke="#5a6472" stroke-width="1.8" marker-end="url(#a)"/>

  <rect x="300" y="860" width="280" height="48" rx="6" fill="#fbf2e0" stroke="#a86d1f" stroke-width="2.2"/>
  <text x="440" y="885">Scientific Principle Selection</text>
  <line x1="440" y1="908" x2="440" y2="936" stroke="#5a6472" stroke-width="1.8" marker-end="url(#a)"/>

  <rect x="300" y="940" width="280" height="48" rx="6" fill="#e6f4ee" stroke="#1f7a55" stroke-width="1.8"/>
  <text x="440" y="957" font-size="13.5">Cognitive Reframing &amp;</text>
  <text x="440" y="973" font-size="13.5">Narrative Generation</text>

  <!-- ============ THREE-WAY SPLIT ============ -->
  <path d="M 440 988 L 440 1012 M 180 1012 L 700 1012" fill="none" stroke="#5a6472" stroke-width="1.8"/>
  <line x1="180" y1="1012" x2="180" y2="1042" stroke="#5a6472" stroke-width="1.8" marker-end="url(#a)"/>
  <line x1="440" y1="1012" x2="440" y2="1042" stroke="#5a6472" stroke-width="1.8" marker-end="url(#a)"/>
  <line x1="700" y1="1012" x2="700" y2="1042" stroke="#5a6472" stroke-width="1.8" marker-end="url(#a)"/>

  <rect x="90" y="1046" width="180" height="48" rx="6" fill="#e6f4ee" stroke="#1f7a55" stroke-width="1.8"/>
  <text x="180" y="1071">Narrative Text</text>

  <rect x="350" y="1046" width="180" height="48" rx="6" fill="#e6f4ee" stroke="#1f7a55" stroke-width="1.8"/>
  <text x="440" y="1071">Voice Generation</text>

  <rect x="610" y="1046" width="180" height="48" rx="6" fill="#e6f4ee" stroke="#1f7a55" stroke-width="1.8"/>
  <text x="700" y="1071">Visual Generation</text>

  <!-- merge -->
  <path d="M 180 1094 L 180 1124 L 700 1124 L 700 1094 M 440 1094 L 440 1124"
        fill="none" stroke="#5a6472" stroke-width="1.8"/>
  <line x1="440" y1="1124" x2="440" y2="1152" stroke="#5a6472" stroke-width="1.8" marker-end="url(#a)"/>

  <!-- ============ STORE + DISPLAY ============ -->
  <rect x="320" y="1156" width="240" height="48" rx="6" fill="#eef0f3" stroke="#5a6472" stroke-width="1.8"/>
  <text x="440" y="1181">Store in Database</text>
  <line x1="440" y1="1204" x2="440" y2="1232" stroke="#5a6472" stroke-width="1.8" marker-end="url(#a)"/>

  <rect x="300" y="1236" width="280" height="48" rx="6" fill="#eaf1f9" stroke="#2563a8" stroke-width="1.8"/>
  <text x="440" y="1253" font-size="13.5">Display Personalized</text>
  <text x="440" y="1269" font-size="13.5">Experience to User</text>

  <!-- feedback loop: revisit -->
  <path d="M 580 1260 L 940 1260 L 940 484 L 566 484"
        fill="none" stroke="#5a6472" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#a)"/>
  <text x="940" y="860" font-size="12.5" font-weight="700" fill="#5a6472"
        transform="rotate(90 940 860)">Revisit &amp; Personalize Future Sessions</text>

  </g>
</svg>

</div>
</body>
</html>
